name: Process New SoC Issue

on:
  issues:
    types: [opened, labeled]

jobs:
  import-cpuinfo-and-pr:
    # Runs only if the issue has the 'new-soc' label (set by the Issue Form)
    if: contains(github.event.issue.labels.*.name, 'new-soc')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml


      - name: Parse Issue and Run import-cpuinfo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/workflows/process-cpuinfo-issue.py


      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: "Add ${{ env.SOC_VENDOR }} ${{ env.SOC_NAME }}"
          body: |
            Automated CPU data import generated from issue #${{ github.event.issue.number }}.

            **Additional info from the reporter:**
            ${{ env.EXTRA_INFO || 'No additional info provided.' }}

            Closes #${{ github.event.issue.number }}
          branch: "add-soc-${{ github.event.issue.number }}"
          commit-message: "Add ${{ env.SOC_VENDOR }} ${{ env.SOC_NAME }}"
          delete-branch: true
          add-paths: data/
